# Vývoj: docker compose up -d      → http://localhost:3200
# Testy: docker compose --profile test run --rm e2e
#
# Místní databáze nemá heslo (trust): port se ven nepublikuje, dostane se
# k ní jen aplikace uvnitř Dockeru. Vývoj proto nepotřebuje .env a žádné
# heslo neleží v souborech. Na Railway má databáze vlastního uživatele
# s heslem na společném serveru CRM (DATABASE_URL nastavuje Jakub).
name: provozni-portal

services:
  # Postgres 18.6 — stejná verze jako společný server na Railway.
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: portal
      POSTGRES_DB: portal
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
    # Port 3200, ať se nepere s CRM (3000) ani asistentem (8000).
    ports:
      - "127.0.0.1:3200:3000"
    volumes:
      - .:/app
      # node_modules a .next zůstávají v kontejneru — na disku jsou
      # windowsové binárky, v kontejneru běží Linux.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    # Při startu: klient Prismy, migrace a tajemství přihlášení vymyšlené
    # pro tento běh (žádné tajemství v souborech; po restartu se
    # přihlašuje znovu).
    command:
      - sh
      - -c
      - >-
        npx prisma generate && npx prisma migrate deploy &&
        export BETTER_AUTH_SECRET=$$(head -c 32 /dev/urandom | base64) &&
        exec npm run dev
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://portal@db:5432/portal
      BETTER_AUTH_URL: http://localhost:3200
      # Bind mount z Windows neposílá události o změnách souborů.
      WATCHPACK_POLLING: "true"

  # --- Testy: vlastní databáze v paměti, vlastní server, nic ven ---------
  db-test:
    profiles: [test]
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: portal
      POSTGRES_DB: portal_test
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Playwright si pustí vlastní aplikaci (port 3100, jen uvnitř) nad
  # databází v paměti `portal_test`. Vývojová data testy nevidí.
  # Verze obrazu musí být stejná jako @playwright/test v package.json.
  # 1.64.1 jako CRM — sdílí obraz (3,6 GB), disk C: je skoro plný (7. 11. 2026).
  e2e:
    profiles: [test]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    depends_on:
      db-test:
        condition: service_healthy
    working_dir: /app
    init: true
    ipc: host
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # Vlastní mezipaměť Nextu — dva servery nad jednou `.next` se nesnesou.
      - next_cache_test:/app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://portal@db-test:5432/portal_test
      # „1“ = testy proti produkčnímu sestavení (na GitHubu). Doma next dev.
      E2E_PRODUKCE: ${E2E_PRODUKCE:-}
      # Nový klíč ke službě mimo počítač sem patří jako prázdný.
    command: ["npx", "playwright", "test"]

volumes:
  db_data:
  node_modules:
  next_cache:
  next_cache_test:
